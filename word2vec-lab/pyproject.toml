[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "word2vec-lab"
version = "0.1.0"
description = "A from-scratch NumPy Word2Vec experiment with analogy and neighborhood evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
viz = ["matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"]
fasttext = ["gensim>=4.4,<5"]

[project.scripts]
word2vec-lab = "word2vec_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["word2vec_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
