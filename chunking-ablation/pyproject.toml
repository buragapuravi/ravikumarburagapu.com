[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chunking-ablation"
version = "0.1.0"
description = "A reproducible chunking strategy ablation for retrieval-augmented QA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "tiktoken>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
chunking-ablation = "chunking_ablation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chunking_ablation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
