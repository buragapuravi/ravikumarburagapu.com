[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-chief-of-staff"
version = "0.1.0"
description = "A privacy-conscious, MCP-powered personal chief-of-staff assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain-mcp-adapters>=0.1.9,<1",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.6,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
chief-of-staff = "chief_of_staff.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chief_of_staff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
