[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmarkkit-llm"
version = "0.1.0"
description = "Reproducible inference and RAG benchmarking for OpenAI-compatible LLM servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36,<2", "pandas>=2.2,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
benchmarkkit = "benchmarkkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarkkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
