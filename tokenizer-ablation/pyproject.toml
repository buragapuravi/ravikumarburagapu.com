[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenizer-ablation"
version = "0.1.0"
description = "A reproducible tokenizer and downstream code-identifier ablation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7,<1"]
transformers = ["transformers>=4.40,<5"]
dev = ["pytest>=8,<9"]

[project.scripts]
tokenizer-ablation = "tokenizer_ablation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenizer_ablation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
