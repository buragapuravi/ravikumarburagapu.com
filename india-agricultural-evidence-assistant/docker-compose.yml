services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agri_evidence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - agri-postgres:/var/lib/postgresql/data

volumes:
  agri-postgres:
